<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; font-weight: 900; src: url("assets/fonts/inter-latin-900-normal.woff2") format("woff2"); }
        @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s6-bg { position: absolute; inset: 0; background: #0a0a0a; }
        #s6-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 70px 160px; font-family: "Inter", sans-serif; color: #ffffff; }
        #s6-stage .m { display: block; overflow: hidden; padding: 36px 12px 10px; margin-top: -30px; }
        #s6-title { display: block; font-weight: 900; font-size: 100px; letter-spacing: -0.045em; line-height: 0.95; white-space: nowrap; }
        #s6-title .red { color: #ff2d2d; }
        #s6-wrap { position: relative; margin-top: 60px; padding: 18px; border-radius: 52px; }
        #s6-beam { position: absolute; inset: 0; border-radius: 52px; padding: 4px; opacity: 0; --a: 0deg;
          background: conic-gradient(from var(--a), transparent 0deg 280deg, #ff2d2d 330deg, #ffffff 352deg, transparent 360deg);
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        #s6-grid { display: grid; grid-template-columns: 440px 440px; grid-auto-rows: 400px; gap: 24px; }
        #s6-stage .cell { display: flex; flex-direction: column; justify-content: space-between; padding: 44px 40px; border-radius: 36px; background: #141414; border: 2px solid #262626; }
        #s6-stage .ico { width: 96px; height: 96px; }
        #s6-stage .ico path, #s6-stage .ico circle { fill: none; stroke: #ffffff; stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
        #s6-stage .fig { font-weight: 900; font-size: 92px; letter-spacing: -0.05em; line-height: 1; color: #ff2d2d; white-space: nowrap; }
        #s6-stage .lbl { font-weight: 900; font-size: 40px; letter-spacing: 0.04em; line-height: 1.1; margin-top: 10px; }
      </style>
      <div id="root" data-composition-id="s06-recap" data-width="1080" data-height="1920">
        <div id="s6-bg" class="clip" data-start="0" data-duration="5.4545" data-track-index="0"></div>
        <div id="s6-stage" class="clip" data-start="0" data-duration="5.4545" data-track-index="1">
          <span class="m"><span id="s6-title">LA FORMULE <span class="red">10/10</span></span></span>
          <div id="s6-wrap">
            <div id="s6-beam"></div>
            <div id="s6-grid">
              <div class="cell" id="s6-a">
                <svg class="ico" style="width: 170px" viewBox="0 0 240 100" aria-hidden="true"><path d="M62 50 H178 M30 22 H48 V78 H30 Z M48 32 H62 V68 H48 Z M210 22 H192 V78 H210 Z M192 32 H178 V68 H192 Z M14 50 H30 M210 50 H226" /></svg>
                <div><div class="fig">3×</div><div class="lbl">SALLE</div></div>
              </div>
              <div class="cell" id="s6-b">
                <svg class="ico" viewBox="0 0 140 110" aria-hidden="true"><path d="M36 8 C36 8 8 44 8 62 A28 28 0 0 0 64 62 C64 44 36 8 36 8 Z" /><path d="M112 20 A34 34 0 1 0 134 70 A27 27 0 1 1 112 20 Z" /></svg>
                <div><div class="fig">2L · 8H</div><div class="lbl">EAU + SOMMEIL</div></div>
              </div>
              <div class="cell" id="s6-c">
                <svg class="ico" viewBox="0 0 220 150" aria-hidden="true"><path d="M110 30 C85 14 45 12 14 20 V132 C45 124 85 126 110 142 Z M110 30 C135 14 175 12 206 20 V132 C175 124 135 126 110 142" /></svg>
                <div><div class="fig">10 p/j</div><div class="lbl">LECTURE</div></div>
              </div>
              <div class="cell" id="s6-d">
                <svg class="ico" viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="34" r="16" /><path d="M70 54 V86 M40 70 C52 82 88 82 100 70 M18 116 C40 96 58 96 70 108 C82 96 100 96 122 116" /></svg>
                <div><div class="fig">5 min</div><div class="lbl">MÉDITATION</div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const H = window.HF10;
          const id = "s06-recap";
          const dur = H.scene(id).dur;
          Promise.all([
            document.fonts.load('900 100px "Inter"'),
          ]).then(function () {
            const tl = gsap.timeline({ paused: true });
            const fly = H.spring(0.6, 18, 0.7);
            H.reveal(tl, "#s6-title", H.beat(0));
            // bento cells fly in from their own corner, one per beat
            [["#s6-a", -380, -260, -8], ["#s6-b", 380, -260, 8], ["#s6-c", -380, 300, 6], ["#s6-d", 380, 300, -6]].forEach(function (c, i) {
              tl.fromTo(c[0], { x: c[1], y: c[2], rotation: c[3], scale: 0.7, opacity: 0 },
                { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.7, ease: fly }, H.beat(i + 1));
            });
            tl.fromTo("#s6-grid", { scale: 1 }, { scale: 1.03, duration: dur - H.beat(5), ease: "none" }, H.beat(5));
            H.beam(tl, "#s6-beam", H.beat(5), dur, 1.2);
            window.__timelines[id] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
