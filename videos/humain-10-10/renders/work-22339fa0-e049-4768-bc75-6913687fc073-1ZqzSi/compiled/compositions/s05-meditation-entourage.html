        #s5-stage .ico { flex: 0 0 140px; width: 140px; height: 140px; }
        #s5-stage .ico path, #s5-stage .ico circle { fill: none; stroke: #ffffff; stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }

        #s5-stage .ttl > span { display: block; white-space: nowrap; }
        #s5-stage .red { color: #ff2d2d; }
        #s5-stage .rot { position: relative; width: 100%; height: 108px; }

      <div id="root" data-composition-id="s05-meditation-entourage" data-width="1080" data-height="1920">

                <div id="s5-r2" class="rot">

      </div>
      <script>
        (function () {
          const H = window.HF10;
          const id = "s05-meditation-entourage";
          const v = (i, o) => H.vo(id, i, o);
          Promise.all([
            document.fonts.load('900 84px "Inter"'),
            document.fonts.load('500 42px "Inter"'),
          ]).then(function () {
            const tl = gsap.timeline({ paused: true });
            const c2 = document.querySelector("#s5-c2");
            const shift = (c2.offsetHeight + 44) / 2;
            const pop = H.spring(0.55, 20, 0.6);
            tl.fromTo("#s5-kick", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
            // Animated List: item 1 alone and centred, item 2 pushes in from below
            tl.fromTo("#s5-list", { y: shift }, { y: 0, duration: 0.6, ease: pop }, v(3));
            tl.fromTo("#s5-c1", { y: 260, scale: 0.86, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: pop }, v(0));
            tl.fromTo("#s5-c1 .ico > *", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.08 }, v(0, 0.1));
            H.rotate(tl, document.querySelector("#s5-r1"), [v(1), v(2)]);
            tl.to("#s5-c1", { opacity: 0.7, duration: 0.4, ease: "power2.out" }, v(3));
            tl.fromTo("#s5-c2", { y: 260, scale: 0.86, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: pop }, v(3));
            tl.fromTo("#s5-c2 .ico > *", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.08 }, v(3, 0.1));
            H.rotate(tl, document.querySelector("#s5-r2"), [v(4), v(5), v(6)]);
            window.__timelines[id] = tl;
          });
        })();
      </script>
