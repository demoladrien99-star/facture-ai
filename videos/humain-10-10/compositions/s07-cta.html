<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; font-weight: 900; src: url("assets/fonts/inter-latin-900-normal.woff2") format("woff2"); }
        @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s7-bg { position: absolute; inset: 0; background: #0a0a0a; }
        #s7-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 70px 160px; font-family: "Inter", sans-serif; color: #ffffff; text-align: center; }
        #s7-stage .m { display: block; overflow: hidden; padding: 36px 12px 10px; margin-top: -30px; }
        #s7-title { display: block; font-weight: 900; font-size: 136px; letter-spacing: -0.05em; line-height: 0.95; white-space: nowrap; }
        #s7-btnwrap { position: relative; margin-top: 110px; width: 820px; height: 180px; }
        #s7-spark { position: absolute; inset: -6px; border-radius: 96px; padding: 5px; opacity: 0; --a: 0deg;
          background: conic-gradient(from var(--a), transparent 0deg 250deg, #ff2d2d 300deg, #ffffff 350deg, transparent 360deg);
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        #s7-btn { position: absolute; inset: 0; border-radius: 90px; background: #ff2d2d; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #s7-shine { position: absolute; top: -20%; bottom: -20%; left: 0; width: 180px; background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%); }
        #s7-label { position: relative; font-weight: 900; font-size: 68px; letter-spacing: -0.02em; color: #ffffff; white-space: nowrap; }
        #s7-sub { display: block; font-weight: 500; font-size: 50px; color: #d4d4d4; margin-top: 70px; white-space: nowrap; }
      </style>
      <div id="root" data-composition-id="s07-cta" data-width="1080" data-height="1920">
        <div id="s7-bg" class="clip" data-start="0" data-duration="6.5455" data-track-index="0"></div>
        <div id="s7-stage" class="clip" data-start="0" data-duration="6.5455" data-track-index="1">
          <span class="m"><span id="s7-title">ABONNE-TOI.</span></span>
          <div id="s7-btnwrap">
            <div id="s7-spark"></div>
            <div id="s7-btn">
              <div id="s7-shine"></div>
              <span id="s7-label">DISCORD EN BIO</span>
            </div>
          </div>
          <span class="m"><span id="s7-sub">Le prochain conseil arrive vite.</span></span>
        </div>
      </div>
      <script>
        (function () {
          const H = window.HF10;
          const id = "s07-cta";
          const dur = H.scene(id).dur;
          const v = (i, o) => H.vo(id, i, o);
          Promise.all([
            document.fonts.load('900 136px "Inter"'),
            document.fonts.load('500 50px "Inter"'),
          ]).then(function () {
            const tl = gsap.timeline({ paused: true });
            H.reveal(tl, "#s7-title", v(0));
            tl.fromTo("#s7-title", { scale: 1.12 }, { scale: 1, duration: 0.5, ease: H.spring(0.5, 22, 0.5) }, v(0, 0.08));
            H.reveal(tl, "#s7-sub", v(1));
            // Shimmer Button: springs in on "Discord en bio", conic spark orbits the edge, light sweeps across
            tl.fromTo("#s7-btnwrap", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: H.spring(0.45, 18, 0.7) }, v(2));
            H.beam(tl, "#s7-spark", v(2, 0.2), dur - 0.9, 1.1);
            const sweep = 1.0;
            const sweeps = Math.max(1, Math.floor((dur - 0.9 - v(2, 0.3)) / sweep));
            tl.fromTo("#s7-shine", { x: -220 }, { x: 900, duration: sweep * 0.7, ease: "power2.inOut", repeat: sweeps - 1, repeatDelay: sweep * 0.3 }, v(2, 0.3));
            // final fade to black
            tl.to("#s7-stage", { opacity: 0, duration: 0.8, ease: "power1.in" }, dur - 0.9);
            window.__timelines[id] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
