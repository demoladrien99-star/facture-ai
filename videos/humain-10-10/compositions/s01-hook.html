<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; font-weight: 900; src: url("assets/fonts/inter-latin-900-normal.woff2") format("woff2"); }
        @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s1-bg { position: absolute; inset: 0; background: #0a0a0a; }
        #s1-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 80px 180px; font-family: "Inter", sans-serif; color: #ffffff; text-align: center; }
        #s1-stage .m { display: block; overflow: hidden; padding: 44px 12px 10px; margin-top: -40px; }
        #s1-stage .ln { display: block; font-weight: 900; letter-spacing: -0.045em; line-height: 0.9; }
        #s1-a { font-size: 132px; }
        #s1-b { font-size: 420px; color: #ff2d2d; letter-spacing: -0.07em; line-height: 0.82; }
        #s1-c { font-size: 150px; color: #ff2d2d; }
        #s1-d, #s1-e { font-size: 150px; }
        #s1-gap { height: 36px; }
        #s1-rot { position: relative; width: 760px; height: 92px; margin-top: 90px; }
        #s1-rot .rw { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; opacity: 0; font-weight: 500; font-size: 64px; letter-spacing: 0.14em; color: #ffffff; overflow: hidden; }
        #s1-rot .rw .ch { display: inline-block; }
        #s1-rot .red { color: #ff2d2d; font-weight: 900; letter-spacing: 0.02em; }
        #s1-rule { width: 120px; height: 6px; margin-top: 28px; background: #ff2d2d; }
      </style>
      <div id="root" data-composition-id="s01-hook" data-width="1080" data-height="1920">
        <div id="s1-bg" class="clip" data-start="0" data-duration="3.8182" data-track-index="0"></div>
        <div id="s1-stage" class="clip" data-start="0" data-duration="3.8182" data-track-index="1">
          <span class="m"><span id="s1-a" class="ln">T'ES À</span></span>
          <span class="m"><span id="s1-b" class="ln">50</span></span>
          <span class="m"><span id="s1-c" class="ln">SECONDES</span></span>
          <div id="s1-gap"></div>
          <span class="m"><span id="s1-d" class="ln">DE TOUT</span></span>
          <span class="m"><span id="s1-e" class="ln">CHANGER.</span></span>
          <div id="s1-rule"></div>
          <div id="s1-rot">
            <span class="rw">PHYSIQUE</span>
            <span class="rw">MINDSET</span>
            <span class="rw red">10/10</span>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const H = window.HF10;
          const id = "s01-hook";
          const dur = H.scene(id).dur;
          Promise.all([
            document.fonts.load('900 150px "Inter"'),
            document.fonts.load('500 64px "Inter"'),
          ]).then(function () {
            const tl = gsap.timeline({ paused: true });
            // camera: slow push-in over the whole shot
            tl.fromTo("#s1-stage", { scale: 1 }, { scale: 1.07, duration: dur, ease: "none" }, 0);
            H.reveal(tl, "#s1-a", H.beat(0));
            H.reveal(tl, ["#s1-b", "#s1-c"], H.beat(1), { stagger: 0.08 });
            tl.fromTo("#s1-b", { scale: 1.18 }, { scale: 1, duration: 0.5, ease: H.spring(0.5, 22, 0.5) }, H.beat(1));
            H.reveal(tl, ["#s1-d", "#s1-e"], H.beat(3), { stagger: 0.08 });
            tl.fromTo("#s1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, H.beat(3) + 0.15);
            H.rotate(tl, document.querySelector("#s1-rot"), [H.beat(4), H.beat(5), H.beat(6)]);
            window.__timelines[id] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
